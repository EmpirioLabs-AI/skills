version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The locked ClawHub CLI that publishes the skills (.github/workflows/clawhub.yml).
  # It lives outside .github/ because Dependabot cannot open pull requests for a
  # package file there.
  - package-ecosystem: npm
    directory: /clawhub-cli
    schedule:
      interval: weekly
