name: clawhub

# Publishes a skill to ClawHub when the version in its SKILL.md (metadata.version)
# is not on ClawHub yet. Listing fields come from clawhub.json. Raise a skill's
# version in SKILL.md to release it; versions already on ClawHub are skipped.
# The ClawHub CLI comes from .github/clawhub/package-lock.json (exact versions and
# integrity hashes, no install scripts) and is installed outside the checkout.
# ClawHub has no trusted publishing for skills, so the token is a secret of the
# clawhub environment, which runs only from main and waits for a maintainer's
# approval before the job starts.

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "clawhub.json"
      - "scripts/publish_clawhub.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clawhub-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: clawhub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Offline unit tests
        run: python -m unittest discover -s tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install the ClawHub CLI from its lockfile
        run: |
          mkdir -p "$RUNNER_TEMP/clawhub"
          cp .github/clawhub/package.json .github/clawhub/package-lock.json "$RUNNER_TEMP/clawhub/"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/clawhub"
          echo "$RUNNER_TEMP/clawhub/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Sign in to ClawHub
        run: clawhub login --token "$CLAWHUB_TOKEN" --no-input
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
      - name: Publish new skill versions
        run: python scripts/publish_clawhub.py --clawhub clawhub
